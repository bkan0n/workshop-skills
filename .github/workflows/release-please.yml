name: Prepare release PR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    permissions:
      contents: write
    # Call directly: tags created with GITHUB_TOKEN do not start push workflows.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
      expected-sha: ${{ needs.prepare.outputs.sha }}
